<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 250" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14">
  <title>Robot electronics and Wi-Fi link</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="790" height="250" fill="#ffffff"/>

  <!-- groups -->
  <rect x="15" y="15" width="220" height="220" rx="10" fill="#f4f6fb" stroke="#b7bfd6"/>
  <text x="125" y="38" text-anchor="middle" font-weight="bold" fill="#333">Laptop</text>
  <rect x="345" y="15" width="430" height="220" rx="10" fill="#fdf8ec" stroke="#d9c79a"/>
  <text x="560" y="38" text-anchor="middle" font-weight="bold" fill="#333">Robot</text>

  <!-- nodes -->
  <g fill="#ffffff" stroke="#7b7fd4" stroke-width="1.5">
    <rect x="35" y="60" width="180" height="46" rx="6"/>
    <rect x="35" y="165" width="180" height="46" rx="6"/>
    <rect x="365" y="60" width="180" height="46" rx="6"/>
    <rect x="595" y="60" width="160" height="46" rx="6"/>
    <rect x="595" y="150" width="160" height="56" rx="6"/>
    <rect x="365" y="165" width="180" height="46" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="125" y="88">Tkinter control GUI</text>
    <text x="125" y="193">OpenCV video viewer</text>
    <text x="455" y="88">Arduino UNO R4 WiFi</text>
    <text x="675" y="88">PCA9685 PWM driver</text>
    <text x="675" y="174">12 servos</text>
    <text x="675" y="193" font-size="12.5" fill="#555">4 legs × 3 joints</text>
    <text x="455" y="193">ESP32-CAM</text>
  </g>

  <!-- edges -->
  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="215" y1="83" x2="363" y2="83"/>
    <line x1="545" y1="83" x2="593" y2="83"/>
    <line x1="675" y1="106" x2="675" y2="148"/>
    <line x1="365" y1="188" x2="217" y2="188"/>
  </g>
  <g font-size="12.5" fill="#444" text-anchor="middle">
    <text x="290" y="74">HTTP over Wi-Fi</text>
    <text x="290" y="101" font-family="monospace" font-size="11.5">/servo, /ping</text>
    <text x="570" y="74">I2C</text>
    <text x="290" y="179">video over Wi-Fi</text>
  </g>
  <text x="683" y="132" font-size="12.5" fill="#444">PWM, 50 Hz</text>
</svg>
